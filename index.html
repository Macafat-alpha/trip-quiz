<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅クイズ">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<title>旅クイズ</title>
<style>
/* 配色は Quark デッキテンプレート（design_spec.md）に準拠。白地が基本、夜モードは同じ配色で紺を地にする */
:root {
  --navy: #0C3B6A;
  --cyan: #3FA5C1;
  --blue: #2F7DBD;
  --gold: #C9A24D;
  --red: #D83931;

  --bg: #FFFFFF;
  --bg-tint: rgba(63, 165, 193, .12);
  --panel: #F5F6F8;
  --card: #FFFFFF;
  --line: #E5E7EB;
  --text: #1F2329;
  --muted: #5F6670;
  --faint: #9B9EA2;
  --primary: var(--navy);
  --primary-ink: #FFFFFF;
  --accent: var(--cyan);
  --hl: var(--blue);            /* 行内強調（白地でシアンは文字色に使わない） */
  --good: var(--cyan);
  --good-tint: rgba(63, 165, 193, .12);
  --shadow: 0 1px 2px rgba(12, 59, 106, .06), 0 6px 18px -8px rgba(12, 59, 106, .18);
  --overlay: rgba(31, 35, 41, .45);
  --bar-fade: rgba(255, 255, 255, 0);

  --cA: var(--navy); --cB: var(--cyan); --cC: var(--gold); --cD: var(--red);
  --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0A1A2C;
  --bg-tint: rgba(63, 165, 193, .16);
  --panel: #0F2238;
  --card: #122A44;
  --line: rgba(255, 255, 255, .10);
  --text: #EEF3F8;
  --muted: #A3B3C5;
  --faint: #6F8298;
  --primary: var(--cyan);
  --primary-ink: #04202A;
  --hl: #7CC4DA;
  --good-tint: rgba(63, 165, 193, .18);
  --shadow: 0 8px 24px -12px rgba(0, 0, 0, .6);
  --overlay: rgba(2, 8, 16, .65);
  --bar-fade: rgba(10, 26, 44, 0);
  --cA: #4F7FB4;   /* 紺は暗い地で沈むので明度を上げる */
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--text); font-family: var(--font);
  font-size: 17px; line-height: 1.6; min-height: 100dvh; overscroll-behavior: none;
  background: radial-gradient(90% 45% at 100% 0%, var(--bg-tint) 0%, rgba(63,165,193,0) 70%), var(--bg);
  background-attachment: fixed;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
svg { display: block; }
.wrap { max-width: 520px; margin: 0 auto; padding: calc(14px + var(--safe-t)) 16px calc(128px + var(--safe-b)); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== ボタン ===== */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 56px; padding: 12px 18px; border-radius: var(--r-md);
  background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 17px; color: var(--text);
  transition: transform .08s ease, background .15s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .35; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); box-shadow: var(--shadow); }
.btn.ghost { background: transparent; }
.btn.icon { width: 56px; flex: none; padding: 0; color: var(--muted); }
.btn .sub { font-size: 12px; font-weight: 500; opacity: .8; display: block; line-height: 1.2; }
.btn .stackl { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
.icon-btn {
  width: 44px; height: 44px; border-radius: var(--r-md); display: grid; place-items: center;
  background: var(--card); border: 1px solid var(--line); color: var(--muted);
}
.icon-btn:active { transform: scale(.94); }

/* ===== 下部固定バー ===== */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 18px 16px calc(14px + var(--safe-b));
  background: linear-gradient(to top, var(--bg) 60%, var(--bar-fade));
}
.bar .inner { max-width: 520px; margin: 0 auto; display: flex; gap: 10px; }
.bar .inner > .btn:not(.icon) { flex: 1; }
.bar .inner > .btn.fit { flex: 0 0 auto; width: auto; }

/* ===== 見出しの型（ラベル＋シアンの短いルール） ===== */
.kicker { font-weight: 700; letter-spacing: .2em; font-size: 12px; color: var(--hl); }
.rule { width: 56px; height: 3px; background: var(--cyan); border: 0; margin: 8px 0 0; }

/* ===== ホーム ===== */
.hero { position: relative; margin: 8px 0 22px; border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 16 / 9; background: var(--panel); border: 1px solid var(--line); }
.hero svg, .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.logo { font-size: 40px; font-weight: 900; line-height: 1.2; margin: 14px 0 12px; letter-spacing: .01em; }
.logo em { font-style: normal; color: var(--navy); }
:root[data-theme="dark"] .logo em { color: var(--cyan); }
.hero { --h-sky1: #EEF6F9; --h-sky2: #FFFFFF; --h-far: #C9D6E3; --h-near: #0C3B6A; --h-road: #1F2329; }
:root[data-theme="dark"] .hero { --h-sky1: #07121F; --h-sky2: #10294A; --h-far: #1A3A5E; --h-near: #0B2A4C; --h-road: #050C15; }
.lead { color: var(--muted); margin: 0 0 24px; font-size: 16px; }
.home-actions { display: grid; gap: 12px; }
.alert { border-radius: var(--r-md); padding: 14px 16px; background: rgba(216,57,49,.07); border: 1px solid rgba(216,57,49,.35); color: var(--text); font-size: 14px; }
.alert b { color: var(--red); display: block; margin-bottom: 4px; font-size: 15px; }
.alert ul { margin: 0; padding-left: 18px; }

/* ===== 画面見出し ===== */
.head { display: flex; align-items: flex-start; gap: 12px; margin: 6px 0 18px; }
.head h1 { font-size: 22px; margin: 2px 0 0; line-height: 1.4; }
.head .grow { flex: 1; min-width: 0; }

/* ===== カード・フォーム ===== */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); }
.section-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--navy); margin: 26px 2px 10px; }
:root[data-theme="dark"] .section-title { color: var(--text); }
.section-title svg { color: var(--cyan); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--cyan); border-radius: var(--r-md); padding: 10px 12px 12px; text-align: center; box-shadow: var(--shadow); }
.stat .v { font-weight: 900; font-size: 28px; line-height: 1.2; color: var(--navy); font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] .stat .v { color: var(--text); }
.stat .k { font-size: 12px; color: var(--muted); }
.prow { display: grid; grid-template-columns: 40px 1fr 1fr 36px; gap: 8px; align-items: center; }
.prow + .prow { margin-top: 10px; }
.prow.headrow { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; background: var(--pc); font-size: 16px; flex: none; }
input[type=text], textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: var(--r-sm);
  background: var(--panel); border: 1px solid var(--line); outline: none;
}
input[type=text]:focus, textarea:focus { border-color: var(--cyan); background: var(--card); }
textarea { min-height: 240px; font-size: 13px; font-family: ui-monospace, Menlo, monospace; line-height: 1.5; }
.del { width: 36px; height: 36px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--faint); }
.add { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--hl); font-weight: 700; font-size: 15px; min-height: 40px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; }
.opt + .opt { border-top: 1px solid var(--line); }
.opt .lbl { font-weight: 700; white-space: nowrap; }
.opt .lbl small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
select { min-width: 0; max-width: 60%; min-height: 40px; padding: 6px 12px; border-radius: var(--r-sm); background: var(--panel); border: 1px solid var(--line); }
input[type=range] { width: 140px; accent-color: var(--cyan); }
.switch { appearance: none; -webkit-appearance: none; margin: 0; width: 52px; height: 32px; border-radius: 16px; background: var(--line); position: relative; flex: none; transition: background .15s; }
:root:not([data-theme="dark"]) .switch { background: #D5D8DD; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.switch:checked, :root:not([data-theme="dark"]) .switch:checked { background: var(--cyan); }
.switch:checked::after { left: 23px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 6px 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); font-size: 15px; font-weight: 700; color: var(--faint); }
.chip.on { background: var(--good-tint); border-color: var(--cyan); color: var(--hl); }

/* ===== 出題画面 ===== */
.playtop { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.qpill { font-weight: 700; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qpill b { color: var(--text); font-size: 22px; font-weight: 900; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.tag.spicy { color: var(--red); border-color: rgba(216,57,49,.4); background: rgba(216,57,49,.07); }
.playtop .grow { flex: 1; }
.dots { display: flex; gap: 4px; margin: 0 0 18px; }
.dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.dots i.done { background: var(--navy); }
:root[data-theme="dark"] .dots i.done { background: var(--cyan); }
.dots i.now { background: var(--cyan); }
.bonus {
  display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 14px; padding: 8px;
  border-radius: var(--r-md); font-weight: 900; letter-spacing: .08em; color: #fff; background: var(--gold);
}
.qcard { position: relative; padding: 24px 18px 20px; border-radius: var(--r-lg); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); margin: 8px 0 16px; animation: rise .3s ease both; }
.qcard .qlabel { position: absolute; top: -11px; left: 16px; font-weight: 900; font-size: 12px; letter-spacing: .14em; background: var(--navy); color: #fff; border-radius: 6px; padding: 2px 10px; }
:root[data-theme="dark"] .qcard .qlabel { background: var(--cyan); color: #04202A; }
.qtext { font-size: 24px; line-height: 1.55; font-weight: 700; word-break: break-word; }
.qtext.small { font-size: 15px; font-weight: 500; color: var(--muted); }
.choices { display: grid; gap: 10px; }
.choice {
  display: flex; gap: 14px; align-items: center; min-height: 62px; padding: 9px 14px 9px 9px;
  border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); font-size: 19px; font-weight: 700;
  box-shadow: var(--shadow); animation: rise .3s ease both;
}
.choice:nth-child(2) { animation-delay: .04s; } .choice:nth-child(3) { animation-delay: .08s; } .choice:nth-child(4) { animation-delay: .12s; }
.choice .key { flex: none; width: 44px; height: 44px; border-radius: var(--r-sm); display: grid; place-items: center; font-weight: 900; font-size: 19px; color: #fff; background: var(--kc); }
.choice.correct { border: 2px solid var(--cyan); background: var(--good-tint); }
.choice.dim { opacity: .35; box-shadow: none; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf .choice { justify-content: center; min-height: 116px; font-size: 60px; font-weight: 900; padding: 10px; }
.tf .maru { color: var(--red); } .tf .batsu { color: var(--blue); }
.hint { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 16px; text-align: center; border-radius: var(--r-md); border: 1.5px dashed var(--faint); color: var(--muted); font-weight: 500; }
.hint .big { font-size: 21px; color: var(--text); font-weight: 700; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.live { display: flex; align-items: center; justify-content: center; gap: 18px; min-height: 96px; margin-top: 18px; }
.speaking { display: inline-flex; gap: 10px; align-items: center; color: var(--hl); font-weight: 700; font-size: 15px; background: var(--good-tint); padding: 8px 14px; border-radius: 999px; }
.speaking .eq { display: flex; gap: 3px; align-items: center; height: 16px; }
.speaking .eq i { width: 4px; height: 100%; border-radius: 2px; background: var(--cyan); animation: eq .9s infinite ease-in-out; }
.speaking .eq i:nth-child(2) { animation-delay: .15s; } .speaking .eq i:nth-child(3) { animation-delay: .3s; } .speaking .eq i:nth-child(4) { animation-delay: .45s; }
@keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
.ring { position: relative; width: 88px; height: 88px; }
.ring svg { width: 88px; height: 88px; transform: rotate(-90deg); }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--cyan); transition: stroke-dashoffset 1s linear, stroke .3s; }
.ring.last .fg { stroke: var(--red); }
.ring .n { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 32px; font-variant-numeric: tabular-nums; }
.ring.over .n { font-size: 16px; color: var(--red); }
.tapread { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 999px; background: var(--primary); color: var(--primary-ink); font-weight: 700; }

/* ===== 答え合わせ ===== */
.answer { position: relative; padding: 16px 18px 18px; border-radius: var(--r-lg); margin-bottom: 18px; background: var(--navy); color: #fff; box-shadow: var(--shadow); animation: pop .35s ease both; }
:root[data-theme="dark"] .answer { background: #164A7E; }
.answer .lab { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; letter-spacing: .14em; color: #9ED6E6; }
.answer .val { font-size: 30px; font-weight: 900; line-height: 1.35; margin-top: 2px; word-break: break-word; }
.answer::after { content: ""; position: absolute; left: 18px; bottom: 0; width: 56px; height: 3px; background: var(--cyan); }
@keyframes pop { 0% { opacity: 0; transform: scale(.94); } 100% { opacity: 1; transform: none; } }
.scorehead { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 10px; }
.scorehead h2 { font-size: 17px; margin: 0; }
.scorehead .pts { font-weight: 900; color: var(--gold); font-size: 15px; }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pbtn {
  position: relative; display: flex; align-items: center; gap: 10px; min-height: 62px; padding: 10px 12px;
  border-radius: var(--r-md); background: var(--card); border: 2px solid var(--line); font-size: 18px; font-weight: 700; text-align: left;
  box-shadow: var(--shadow); transition: background .15s, border-color .15s, transform .08s;
}
.pbtn:active { transform: scale(.97); }
.pbtn .avatar { width: 36px; height: 36px; font-size: 15px; }
.pbtn.on { border-color: var(--cyan); background: var(--good-tint); }
.pbtn .check { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; background: var(--cyan); color: #fff; display: none; place-items: center; }
.pbtn.on .check { display: grid; animation: pop .25s ease both; }
.void-note { color: var(--red); font-weight: 700; margin: 10px 2px 0; font-size: 14px; }
.explain { margin: 20px 2px 12px; font-size: 16px; }
.quote { position: relative; margin: 0; padding: 12px 16px 12px 18px; border-radius: 0 var(--r-md) var(--r-md) 0; background: var(--panel); border-left: 3px solid var(--cyan); font-size: 15px; }
.quote .meta { display: block; color: var(--faint); font-size: 12px; margin-top: 4px; }

/* ===== スコア・結果 ===== */
.rank-list { display: grid; gap: 10px; }
.rank-row { display: grid; grid-template-columns: 26px 40px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.rank-row .r { font-weight: 900; font-size: 18px; color: var(--faint); text-align: center; }
.rank-row.first .r { color: var(--gold); }
.rank-row .nm { font-weight: 700; }
.rank-row .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 5px; }
.rank-row .meter i { display: block; height: 100%; border-radius: 3px; background: var(--pc); }
.rank-row .p { font-weight: 900; font-size: 24px; text-align: right; line-height: 1.1; font-variant-numeric: tabular-nums; }
.rank-row .p small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; margin: 22px 0 8px; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 8px; animation: rise .5s ease both; }
.pod .avatar { width: 54px; height: 54px; font-size: 21px; box-shadow: 0 0 0 3px var(--card), 0 0 0 4px var(--line); }
.pod.p1 .avatar { width: 70px; height: 70px; font-size: 27px; box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--gold); }
.pod .nm { font-weight: 700; font-size: 15px; text-align: center; line-height: 1.3; }
.pod .blk { width: 100%; border-radius: var(--r-md) var(--r-md) 4px 4px; display: grid; place-items: start center; padding-top: 10px; font-weight: 900; font-size: 22px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.pod.p1 .blk { height: 118px; background: var(--navy); border-color: var(--navy); color: #fff; }
:root[data-theme="dark"] .pod.p1 .blk { background: #164A7E; }
.pod.p2 .blk { height: 86px; } .pod.p3 .blk { height: 62px; }
.pod.p1 { animation-delay: .45s; } .pod.p2 { animation-delay: .2s; }
.crown { color: var(--gold); margin-bottom: -6px; }
.title-hero { text-align: center; margin: 10px 0 0; }
.title-hero .logo { font-size: 34px; margin: 4px 0 0; }
.title-hero .rule { margin: 8px auto 0; }
.awards { display: grid; gap: 10px; }
.award { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.award .ic { width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center; background: rgba(201,162,77,.15); color: var(--gold); flex: none; }
.award .t { flex: 1; font-size: 13px; color: var(--muted); }
.award .t b { display: block; font-size: 16px; color: var(--text); }
.award .n { font-weight: 700; color: var(--muted); font-size: 14px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; opacity: .9; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }

/* ===== シート ===== */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--overlay); display: flex; align-items: flex-end; animation: fade .2s ease both; }
.sheet { width: 100%; max-width: 520px; margin: 0 auto; background: var(--bg); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 10px 16px calc(20px + var(--safe-b)); max-height: 88dvh; overflow-y: auto; animation: up .25s ease both; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { font-size: 20px; margin: 0 0 14px; }
@keyframes fade { from { opacity: 0; } } @keyframes up { from { transform: translateY(30px); opacity: 0; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="fx"></div>

<script>
"use strict";

/* ===== 定数 ===== */

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const playerNames = players => (players || []).map(p => typeof p === "string" ? p : p && p.name).filter(Boolean);

/* ===== 検証（validate_quiz.py と同じ規則。問題文は表示しない） ===== */
function validate(data) {
  const errors = [];
  if (!data || typeof data !== "object" || Array.isArray(data)) return ["ファイルの中身がクイズの形になっていない"];
  if (data.version !== 1) errors.push("version が 1 ではない");
  if (typeof data.title !== "string" || !data.title) errors.push("title がない");
  const players = Array.isArray(data.players) ? data.players : [];
  const names = playerNames(players);
  if (players.length < 2) errors.push("players が2人未満");
  if (names.length !== players.length) errors.push("players に name のない人がいる");
  if (new Set(names).size !== names.length) errors.push("players の name が重複");
  const qs = data.questions;
  if (!Array.isArray(qs) || !qs.length) { errors.push("questions が空"); return errors; }
  const seen = new Set();
  qs.forEach((q, i) => {
    const tag = `[${(q && q.id) || "#" + (i + 1)}]`;
    if (!q || typeof q !== "object") { errors.push(`${tag} 問題の形になっていない`); return; }
    if (typeof q.id !== "string" || !q.id) errors.push(`${tag} id がない`);
    else if (seen.has(q.id)) errors.push(`${tag} id が重複`);
    seen.add(q.id);
    if (!TYPES.includes(q.type)) { errors.push(`${tag} type が不正`); return; }
    if (typeof q.question !== "string" || !q.question.trim()) errors.push(`${tag} question がない`);
    if ("difficulty" in q && !(q.difficulty in DIFF)) errors.push(`${tag} difficulty が不正`);
    if ("vibe" in q && !(q.vibe in VIBE_LABEL)) errors.push(`${tag} vibe が不正`);
    if ("confidence" in q && !["high", "low"].includes(q.confidence)) errors.push(`${tag} confidence が不正`);
    if ("spicy" in q && typeof q.spicy !== "boolean") errors.push(`${tag} spicy が真偽値ではない`);
    if ("points" in q && !(Number.isInteger(q.points) && q.points >= 1)) errors.push(`${tag} points が不正`);
    const a = q.answer, c = q.choices;
    if (q.type === "choice") {
      if (!(Array.isArray(c) && c.length >= 2 && c.length <= 4 && c.every(x => typeof x === "string" && x))) errors.push(`${tag} choices は2〜4個の文字列`);
      else if (new Set(c).size !== c.length) errors.push(`${tag} choices が重複`);
      else if (!c.includes(a)) errors.push(`${tag} answer が choices に含まれない`);
    } else if (q.type === "who") {
      const pool = c ?? names;
      if (c != null && !(Array.isArray(c) && c.every(x => names.includes(x)))) errors.push(`${tag} who の choices に players 以外の名前`);
      if (!Array.isArray(pool) || !pool.includes(a)) errors.push(`${tag} answer が players に含まれない`);
    } else if (q.type === "truefalse") {
      if (typeof a !== "boolean") errors.push(`${tag} answer が true/false ではない`);
    } else if (q.type === "number") {
      if (typeof a !== "number" || !isFinite(a)) errors.push(`${tag} answer が数値ではない`);
    } else if (q.type === "open") {
      if (typeof a !== "string" || !a.trim()) errors.push(`${tag} answer（模範解答）がない`);
    }
  });
  return errors;
}

/* LINE等から貼ると ```json の囲みや前後の文章が付くので、最初の { から最後の } を取り出す */
function parseLoose(text) {
  const s = text.indexOf("{"), e = text.lastIndexOf("}");
  if (s < 0 || e <= s) throw new Error("JSONが見つからない");
  return JSON.parse(text.slice(s, e + 1));
}

function loadQuiz(data) {
  const errors = validate(data);
  if (errors.length) { ui.importErrors = errors; render(); return; }
  ui.importErrors = null;
  S = { screen: "setup", quiz: data, players: normPlayers(data.players), settings: Object.assign({}, DEFAULT_SETTINGS, { segments: null, theme: S.settings.theme, rate: S.settings.rate, think: S.settings.think }) };
  save(); render();
}

/* ===== 出題リストを作る ===== */
const isPlayable = q => !(q.type === "who" && q.confidence === "low");
const basePoints = q => q.points || (q.difficulty === "hard" ? 2 : 1);

function pool() {
  const st = S.settings;
  return S.quiz.questions.filter(q => isPlayable(q)
    && (st.spicy || !q.spicy)
    && (!st.segments || st.segments.includes(q.segment || "その他")));
}

function buildOrder() {
  const st = S.settings;
  let list = pool().map(q => q.id);
  const byId = Object.fromEntries(S.quiz.questions.map(q => [q.id, q]));
  if (st.count && st.count < list.length) {
    const keep = new Set(shuffle(list).slice(0, st.count));
    list = list.filter(id => keep.has(id));
  }
  if (st.order === "shuffle") {
    // 難易度の段ごとに混ぜて、易→難の流れは保つ
    const tiers = [[], [], []];
    list.forEach(id => tiers[DIFF[byId[id].difficulty] ?? 1].push(id));
    list = tiers.flatMap(shuffle);
  }
  return list;
}

function segmentsOf(quiz) {
  const seen = [];
  quiz.questions.filter(isPlayable).forEach(q => { const s = q.segment || "その他"; if (!seen.includes(s)) seen.push(s); });
  return seen;
}

/* ===== 得点 ===== */
const curQ = () => S.quiz.questions.find(q => q.id === S.order[S.idx]);
const isDouble = i => S.settings.double && i >= S.order.length - S.settings.doubleLast;
function pointsAt(i) { const q = S.quiz.questions.find(x => x.id === S.order[i]); return basePoints(q) * (isDouble(i) ? 2 : 1); }

function tally() {
  const t = Object.fromEntries(S.players.map(p => [p.name, { name: p.name, pts: 0, correct: 0 }]));
  let scored = 0;
  S.order.forEach((id, i) => {
    const r = S.records[id];
    if (!r || r.void) return;
    scored++;
    r.winners.forEach(w => { if (t[w]) { t[w].pts += pointsAt(i); t[w].correct++; } });
  });
  const list = Object.values(t).sort((a, b) => b.pts - a.pts || b.correct - a.correct);
  let rank = 0, prev = null;
  list.forEach((p, i) => { if (!prev || p.pts !== prev.pts) rank = i + 1; p.rank = rank; prev = p; });
  return { list, scored };
}

/* ===== 読み上げ（Web Speech API） ===== */
const Speech = {
  voice: null, token: 0,
  supported: "speechSynthesis" in window,
  init() {
    if (!this.supported) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
      const pref = ["Kyoko", "O-Ren", "Otoya", "Hattori", "Google 日本語"];
      this.voice = pref.map(n => vs.find(v => v.name.includes(n))).find(Boolean) || vs.find(v => v.localService) || vs[0] || null;
    };
    pick();
    speechSynthesis.onvoiceschanged = pick;
  },
  cancel() { this.token++; if (this.supported) { try { speechSynthesis.cancel(); } catch {} } ui.speaking = false; },
  /* parts を順に読む。iOSでは onend が来ないことがあるので、文字数から見積もった時間で先へ進める */
  say(parts, onend) {
    this.cancel();
    const token = ++this.token;
    if (!S.settings.voice || !this.supported) { paintLive(); onend && onend(); return; }
    ui.speaking = true; paintLive();
    let i = 0;
    const next = () => {
      if (token !== this.token) return;
      if (i >= parts.length) { ui.speaking = false; paintLive(); onend && onend(); return; }
      const text = parts[i++];
      let done = false;
      const go = () => { if (done) return; done = true; clearTimeout(fb); next(); };
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP"; if (this.voice) u.voice = this.voice;
      u.rate = S.settings.rate;
      u.onend = go; u.onerror = go;
      const fb = setTimeout(go, (text.length * 180 / S.settings.rate) + 2500);
      speechSynthesis.speak(u);
    };
    next();
  },
};

/* 人名は読みに置き換えてから読ませる（漢字の名前を正しく読ませるため） */
function toSpeech(text) {
  let s = String(text);
  [...S.players].sort((a, b) => b.name.length - a.name.length)
    .forEach(p => { if (p.reading && p.reading !== p.name) s = s.split(p.name).join(p.reading); });
  return s.replace(/「|」/g, "、");
}
function readingOf(name) { const p = S.players.find(x => x.name === name); return p ? p.reading : name; }
const whoChoices = q => q.choices || playerNames(S.quiz.players);

function questionParts(q) {
  const parts = [];
  if (isDouble(S.idx) && S.idx === S.order.length - S.settings.doubleLast) parts.push("ここから得点2倍！");
  parts.push(S.idx === S.order.length - 1 ? "最終問題。" : `第${S.idx + 1}問。`);
  parts.push(q.speech ? q.speech : toSpeech(q.question));
  if (q.type === "choice") q.choices.forEach((c, i) => parts.push(`${KEYS[i]}、${toSpeech(c)}。`));
  if (q.type === "who") whoChoices(q).forEach((c, i) => parts.push(`${KEYS[i] || ""}、${readingOf(c)}。`));
  if (q.type === "truefalse" && !/マル|バツ|○|×/.test(q.question)) parts.push("マルか、バツか。");
  return parts;
}
function answerText(q) {
  if (q.type === "truefalse") return q.answer ? "○" : "×";
  if (q.type === "number") return fmtNum(q.answer) + (q.unit || "");
  if (q.type === "choice") return `${KEYS[q.choices.indexOf(q.answer)]}. ${q.answer}`;
  return String(q.answer);
}
function answerParts(q) {
  let a;
  if (q.type === "truefalse") a = q.answer ? "マル" : "バツ";
  else if (q.type === "who") a = readingOf(q.answer);
  else if (q.type === "choice") a = `${KEYS[q.choices.indexOf(q.answer)]}、${toSpeech(q.answer)}`;
  else if (q.type === "number") a = fmtNum(q.answer) + (q.unit || "");
  else a = toSpeech(q.answer);
  const parts = [(q.type === "open" ? "答えは、" : "正解は、") + a + "！"];
  if (S.settings.readExplain && q.explanation) parts.push(toSpeech(q.explanation));
  return parts;
}

/* ===== 考える時間 ===== */
let timerId = null;
function stopTimer() { clearInterval(timerId); timerId = null; ui.timeLeft = null; }
function startTimer() {
  stopTimer();
  if (!S.settings.think) return;
  ui.timeLeft = S.settings.think; paintLive();
  timerId = setInterval(() => {
    ui.timeLeft--;
    if (ui.timeLeft <= 0) { clearInterval(timerId); timerId = null; beep(); Speech.say(["時間です！"]); }
    paintLive();
  }, 1000);
}
let actx = null;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880; g.gain.value = .08;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + .25);
  } catch {}
}

/* ===== 画面を暗くしない（対応端末のみ） ===== */
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.screen === "play") keepAwake(); });

/* ===== 進行 ===== */
function ask() {
  S.phase = "question"; save(); render();
  Speech.say(questionParts(curQ()), startTimer);
}
function reveal() {
  stopTimer();
  S.phase = "reveal";
  const r = S.records[curQ().id];
  S.pick = r && !r.void ? r.winners.slice() : [];
  save(); render();
  Speech.say(answerParts(curQ()));
}
function commit(isVoid) {
  const q = curQ();
  S.records[q.id] = { winners: isVoid ? [] : S.pick.slice(), void: !!isVoid };
  S.pick = [];
  goNext();
}
function goNext() {
  Speech.cancel(); stopTimer();
  if (S.idx >= S.order.length - 1) { S.screen = "result"; save(); render(); confetti(); Speech.say(resultParts()); return; }
  S.idx++; ask();
}
function goPrev() {
  if (S.idx === 0) return;
  Speech.cancel(); stopTimer();
  S.idx--; S.phase = "reveal";
  const r = S.records[curQ().id];
  S.pick = r && !r.void ? r.winners.slice() : [];
  save(); render();
}
function resultParts() {
  const { list } = tally();
  const top = list.filter(p => p.rank === 1);
  return ["結果発表！", `優勝は、${top.map(p => readingOf(p.name)).join("と、")}！`, `${top[0].pts}点でした。`];
}
function confetti() {
  const fx = document.getElementById("fx");
  const colors = ["#0C3B6A", "#3FA5C1", "#C9A24D", "#2F7DBD", "#D83931", "#9ED6E6"];
  fx.innerHTML = `<div class="confetti">${Array.from({ length: 70 }, () => {
    const l = Math.random() * 100, d = 2.4 + Math.random() * 2.2, dl = Math.random() * 1.2, c = colors[Math.floor(Math.random() * colors.length)];
    return `<i style="left:${l}%;background:${c};animation-duration:${d}s;animation-delay:${dl}s;transform:rotate(${Math.random() * 180}deg)"></i>`;
  }).join("")}</div>`;
  setTimeout(() => { fx.innerHTML = ""; }, 5000);
}

/* 読み上げ中の表示とカウントダウンだけを差し替える */
function paintLive() {
  const el = document.getElementById("live");
  if (!el) return;
  let h = "";
  if (ui.speaking) h += `<span class="speaking"><span class="eq"><i></i><i></i><i></i><i></i></span>読み上げ中</span>`;
  if (ui.timeLeft != null) {
    const C = 2 * Math.PI * 38, frac = Math.max(0, ui.timeLeft / S.settings.think);
    const over = ui.timeLeft <= 0;
    h += `<div class="ring ${ui.timeLeft <= 3 ? "last" : ""} ${over ? "over" : ""}">
      <svg viewBox="0 0 88 88"><circle class="bg" cx="44" cy="44" r="38" fill="none" stroke-width="8"/>
      <circle class="fg" cx="44" cy="44" r="38" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg>
      <div class="n">${over ? "時間！" : ui.timeLeft}</div></div>`;
  }
  if (!h && ui.needsTap) h = `<button class="tapread" data-a="reread">${I.play}問題を読み上げる</button>`;
  el.innerHTML = h;
}

function alertBox(errors) {

function choicesHtml(q, rev) {
  if (q.type === "choice" || q.type === "who") {
    const cs = q.type === "who" ? whoChoices(q) : q.choices;
    return `<div class="choices">${cs.map((c, k) => `<div class="choice ${rev ? (c === q.answer ? "correct" : "dim") : ""}">
      <span class="key" style="--kc:${KEY_COLORS[k % 4]}">${KEYS[k] || ""}</span><span>${esc(c)}</span></div>`).join("")}</div>`;
  }
  if (q.type === "truefalse") {
    return `<div class="tf">${[true, false].map(v => `<div class="choice ${v ? "maru" : "batsu"} ${rev ? (v === q.answer ? "correct" : "dim") : ""}">${v ? "○" : "×"}</div>`).join("")}</div>`;
  }
  if (q.type === "number") return `<div class="hint"><span class="big">数字で答えて！</span>一番近い人が正解${q.unit ? `（単位：${esc(q.unit)}）` : ""}</div>`;
  return `<div class="hint"><span class="big">自由に答えて！</span>正解かどうかは司会が判定</div>`;
}

function rankRows() {
  const { list } = tally();
  const max = Math.max(1, ...list.map(p => p.pts));
  return `<div class="rank-list">${list.map(p => `<div class="rank-row ${p.rank === 1 && p.pts ? "first" : ""}">
    <div class="r">${p.rank}</div>${avatar(p.name)}
    <div><div class="nm">${esc(p.name)}</div><div class="meter"><i style="width:${p.pts / max * 100}%;--pc:${pcolor(p.name)}"></i></div></div>
    <div class="p">${p.pts}<small>${p.correct}問正解</small></div>
  </div>`).join("")}</div>`;
}

function vResult() {
  const { list, scored } = tally();
  const podium = [list[1], list[0], list[2]].map((p, k) => {
    if (!p) return "<div></div>";
    const cls = ["p2", "p1", "p3"][k];
    return `<div class="pod ${cls}">${p.rank === 1 ? `<span class="crown">${I.crown}</span>` : ""}${avatar(p.name)}<div class="nm">${esc(p.name)}</div><div class="blk">${p.pts}</div></div>`;
  }).join("");
  const titles = Object.entries(VIBE_LABEL).map(([v, label]) => {
    const ids = S.order.filter(id => S.quiz.questions.find(q => q.id === id).vibe === v && S.records[id] && !S.records[id].void);
    if (!ids.length) return null;
    const c = Object.fromEntries(S.players.map(p => [p.name, 0]));
    ids.forEach(id => S.records[id].winners.forEach(w => { if (w in c) c[w]++; }));
    const best = Math.max(...Object.values(c));
    if (!best) return null;
    return { label: `${label}問題王`, who: Object.keys(c).filter(k => c[k] === best).join("・"), n: best, of: ids.length };
  }).filter(Boolean);
  return `<div class="wrap">
    <div class="title-hero"><div class="kicker">RESULT</div><div class="logo">結果発表</div><hr class="rule"></div>
    <div class="podium">${podium}</div>
    <div class="section-title">${I.list}最終順位<span class="muted" style="font-weight:400;margin-left:auto">採点 ${scored}/${S.order.length}問</span></div>
    ${rankRows()}
    ${titles.length ? `<div class="section-title">${I.medal}部門賞</div><div class="awards">${titles.map(t => `<div class="award"><span class="ic">${I.medal}</span><span class="t">${esc(t.label)}<b>${esc(t.who)}</b></span><span class="n">${t.n}/${t.of}</span></div>`).join("")}</div>` : ""}
  </div>
  <div class="bar"><div class="inner">
    <button class="btn icon" data-a="back-to-play" aria-label="最後の問題に戻る">${I.back}</button>
    <button class="btn primary" data-a="new">別のクイズへ</button>
  </div></div>`;
}

  S.order = buildOrder();
  S.idx = 0; S.records = {}; S.pick = [];
  S.screen = "play"; ui.needsTap = false;
  keepAwake();
  // iOSはタップ直後でないと音が出ないので、このタップの中で読み上げを始める
  ask();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  // シートの中の余白をタップしても閉じない
  if (el.dataset.a === "ov-close" && e.target.closest("[data-stop]") && !e.target.closest("button")) return;
  const a = el.dataset.a;
  switch (a) {
    case "to-paste": ui.importErrors = null; S.screen = "paste"; render(); break;
    case "home": ui.importErrors = null; S.screen = "home"; save(); render(); break;
    case "resume": S.screen = "play"; ui.needsTap = S.phase === "question"; keepAwake(); save(); render(); paintLive(); break;
    case "sample": loadQuiz(JSON.parse(JSON.stringify(SAMPLE))); break;
    case "paste-load": {
      ui.pasteText = document.getElementById("paste").value;
      try { loadQuiz(parseLoose(ui.pasteText)); } catch (err) { ui.importErrors = ["JSONとして読めない（" + err.message + "）"]; render(); }
      break;
    }
    case "add-player": S.players.push({ name: `プレイヤー${S.players.length + 1}`, reading: `プレイヤー${S.players.length + 1}` }); save(); render(true); break;
    case "del-player": if (S.players.length > 2) { S.players.splice(+el.dataset.i, 1); save(); render(true); } break;
    case "seg": {
      const all = segmentsOf(S.quiz), s = el.dataset.seg;
      let cur = S.settings.segments || all.slice();
      cur = cur.includes(s) ? cur.filter(x => x !== s) : [...cur, s];
      S.settings.segments = cur.length === all.length ? null : cur.length ? cur : [s];
      save(); render(true); break;
    }
    case "start": startGame(); break;
    case "reread": ui.needsTap = false; stopTimer(); Speech.say(questionParts(curQ()), startTimer); break;
    case "skip": S.records[curQ().id] = { winners: [], void: true, skipped: true }; goNext(); break;
    case "reveal": reveal(); break;
    case "pick": {
      const n = el.dataset.name;
      S.pick = S.pick.includes(n) ? S.pick.filter(x => x !== n) : [...S.pick, n];
      save(); render(true); break;
    }
    case "next": commit(false); break;
    case "void": commit(true); break;
    case "prev": goPrev(); break;
    case "ov-score": ui.overlay = "score"; render(true); break;
    case "ov-menu": ui.overlay = "menu"; render(true); break;
    case "ov-close": ui.overlay = null; render(true); paintLive(); break;
    case "restart":
      if (confirm("得点を消して、最初からやり直しますか？")) { ui.overlay = null; Speech.cancel(); stopTimer(); S.screen = "setup"; delete S.order; delete S.records; save(); render(); }
      break;
    case "back-to-play": {
      S.screen = "play"; S.idx = S.order.length - 1; S.phase = "reveal";
      const r = S.records[curQ().id]; S.pick = r && !r.void ? r.winners.slice() : [];
      save(); render(); break;
    }
    case "new":
      if (S.screen !== "result" && !confirm("今のクイズを終了して、別のクイズを読み込みますか？")) break;
      ui.overlay = null; Speech.cancel(); stopTimer();
      S = { screen: "home", settings: Object.assign({}, DEFAULT_SETTINGS, { theme: S.settings.theme }) }; store.clear(); render(); break;
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "file") {
    const f = t.files && t.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { loadQuiz(parseLoose(String(rd.result))); } catch (err) { ui.importErrors = ["JSONとして読めない（" + err.message + "）"]; render(); } };
    rd.onerror = () => { ui.importErrors = ["ファイルを読めなかった"]; render(); };
    rd.readAsText(f);
    return;
  }
  if (t.dataset.s) {
    const k = t.dataset.s;
    S.settings[k] = t.type === "checkbox" ? t.checked : (k === "order" || k === "theme" ? t.value : Number(t.value));
    if (k === "voice" && !S.settings.voice) Speech.cancel();
    if (k === "theme") applyTheme();
    save(); render(true); paintLive();
    return;
  }
  if (t.dataset.p != null) {
    const p = S.players[+t.dataset.p], old = p.name;
    p[t.dataset.f] = t.value.trim() || old;
    save(); render(true);
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.s === "rate") {
    S.settings.rate = Number(e.target.value);
    const lab = document.getElementById("rate-lbl"); if (lab) lab.textContent = `速さ ${S.settings.rate.toFixed(1)}倍`;
    save();
  }
});

/* ===== 起動 ===== */
applyTheme();
Speech.init();
if (["setup", "play", "result"].includes(S.screen) && !S.quiz) S.screen = "home";
if (S.screen === "paste") S.screen = "home";
if (S.screen === "play") {
  // 再読み込みからの再開。音はタップしてから
  if (!S.order || !curQ()) S.screen = "setup";
  else { ui.needsTap = S.phase === "question"; keepAwake(); }
}
render();
paintLive();
</script>
</body>
</html>
